<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Bocal</title>
<meta name="theme-color" content="#0f1d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Bocal">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1d33;--night2:#18294a;--night3:#1d3058;--amber:#f0a73a;--foam:#f7ead2;--mist:#8ea1bf;--sand1:#efdfbb;--sand2:#cdb078;--coral:#e98a6b;--sage:#7fb7a4;--line:rgba(247,234,210,.12);
 --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Work Sans',-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--night);color:var(--foam);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--foam);background:rgba(247,234,210,.06);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
input:focus{outline:1px solid var(--amber)}
.app{max-width:480px;margin:0 auto;min-height:100%;background:radial-gradient(120% 50% at 50% 0%,var(--night2),var(--night) 70%);position:relative}
.screen{display:none;padding:calc(env(safe-area-inset-top) + 26px) 0 calc(env(safe-area-inset-bottom) + 90px)}
.screen.on{display:block}
.lab{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.num{font-family:var(--serif);font-weight:300;font-size:64px;line-height:1;white-space:nowrap}
.num i{font-style:italic;font-size:.5em;color:var(--amber);margin-left:2px}
.ital{font-family:var(--serif);font-style:italic;font-weight:300;color:var(--mist);font-size:18px}
.pad{padding:0 26px}
.nowrap{white-space:nowrap}
/* navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:linear-gradient(transparent,var(--night) 35%);padding:18px 0 calc(env(safe-area-inset-bottom) + 14px)}
nav .in{max-width:480px;width:100%;display:flex;justify-content:space-around}
nav button{font-family:var(--serif);font-size:19px;color:var(--mist);padding:6px 14px}
nav button.on{color:var(--foam);font-style:italic}
/* saisir */
.top{display:flex;gap:18px;align-items:flex-end;padding:0 26px}
.top .info{flex:1;min-width:0}
.courses-du-jour{font-size:14px;color:var(--mist);margin-top:4px}
.intro{margin:16px 26px 0;padding:14px 16px;border:1px solid var(--line);border-radius:6px;font-size:16px;line-height:1.5;color:var(--mist)}
.intro b{color:var(--foam);font-weight:500}
.intro button{margin-top:8px;color:var(--amber);font-size:16px}
.cats{display:flex;flex-wrap:wrap;gap:7px;padding:20px 16px 6px;font-family:var(--serif);font-size:16px;color:var(--mist)}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:8px 11px;border:1px solid var(--line);border-radius:20px;color:var(--mist);flex:none}
.cats button.on{color:var(--night);background:var(--foam);border-color:var(--foam);font-style:italic}
.items{padding:4px 26px}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;gap:12px}
.item .n{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1.15}
.item .n small{display:block;font-family:var(--sans);font-size:13px;color:var(--mist);margin-top:2px}
.item .p{font-size:18px;font-weight:500;color:var(--amber);border:1px solid rgba(240,167,58,.5);border-radius:2px;padding:9px 10px;min-width:84px;text-align:center;white-space:nowrap;flex:none;transition:background .2s,color .2s}
.item .p.ask{color:var(--mist);border-color:var(--line);font-size:16px}
.item.flash .p{background:var(--amber);color:var(--night)}
.item:active .n{opacity:.7}
.derniere{margin:14px 26px 0;padding:12px 14px;border:1px solid rgba(240,167,58,.35);border-radius:6px;background:rgba(240,167,58,.05)}
.derniere .q{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--mist)}
.derniere .q b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--foam)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{padding:8px 11px;border:1px solid rgba(247,234,210,.25);font-size:16px;border-radius:2px;white-space:nowrap}
.chip.on{border-color:var(--amber);color:var(--amber)}
.chip.t{border-style:dashed;color:var(--mist)}
.chip.t.on{border-style:solid;color:var(--amber);border-color:var(--amber)}
.chip.x{color:var(--coral);border-color:rgba(233,138,107,.4)}
.jour{padding:26px 26px 0}
.jour h3,.bloc h3{font-family:var(--serif);font-weight:300;font-style:italic;font-size:22px;margin-bottom:6px}
.ligne{display:flex;width:100%;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.ligne .h{color:var(--mist);width:46px;flex:none;font-variant-numeric:tabular-nums}
.ligne .m{flex:1}
.ligne .m em{font-style:normal;font-size:13px;color:var(--mist);margin-left:6px}
.ligne .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.vide{color:var(--mist);font-size:16px;font-style:italic;font-family:var(--serif);padding:8px 0}
/* bilan */
.per{display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.per .tabs{display:flex;gap:16px}
.per .tabs button{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);padding:4px 0;border-bottom:1px solid transparent}
.per .tabs button.on{color:var(--foam);border-bottom-color:var(--amber)}
.per .fl{display:flex;gap:4px}
.per .fl button{width:34px;height:34px;font-size:22px;color:var(--mist);border:1px solid var(--line);border-radius:50%}
.per .fl button:disabled{opacity:.25}
.tete{text-align:center;padding:22px 26px 0}
.tete .num{margin-top:6px}
.cap{font-family:var(--serif);font-style:italic;color:var(--coral);font-size:18px;margin-top:4px}
.bocal-wrap{display:flex;justify-content:center;padding-top:10px}
.bocal-wrap svg .sable{transition:transform 1.3s cubic-bezier(.2,.8,.2,1)}
.envie{margin:14px 30px 0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:19px;color:var(--mist);text-align:center;cursor:pointer;min-height:22px}
.envie b{color:var(--foam);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:20px 30px 0;padding-top:12px;border-top:1px solid var(--line)}
.stats div{font-size:13px;color:var(--mist)}
.stats b{display:block;font-family:var(--serif);font-weight:300;font-size:28px;color:var(--foam);line-height:1.1}
.bloc{margin:26px 26px 0}
.catl{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.catl .k{font-family:var(--serif);font-size:20px}
.catl .k small{display:block;font-family:var(--sans);font-size:13px;color:var(--mist);margin-top:2px}
.catl .v{font-family:var(--serif);font-weight:300;font-size:24px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.cal .h{font-size:13px;font-weight:600;color:var(--mist);text-align:center}
.cal .d{aspect-ratio:1;border-radius:6px;background:rgba(247,234,210,.06);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:rgba(247,234,210,.35);opacity:0;transform:scale(.6);animation:pop .35s ease-out forwards}
.cal .d.e{background:transparent;animation:none}
.cal .d.v1{background:rgba(240,167,58,.35);color:var(--foam)}
.cal .d.v2{background:rgba(240,167,58,.68);color:var(--night)}
.cal .d.v3{background:var(--amber);color:var(--night);font-weight:600}
.cal .d.s{background:var(--sage);color:var(--night)}
.cal .d.f{background:transparent;border:1px dashed rgba(247,234,210,.15)}
.cal .d.today{outline:1.5px solid var(--foam);outline-offset:1px}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:var(--mist)}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sante{margin-top:6px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--mist);line-height:1.5}
.sante b{color:var(--foam);font-weight:500}
.ronds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.ronds i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(247,234,210,.3)}
.ronds i.f{background:var(--foam);border-color:var(--foam)}
.ronds i.x{border:1.5px dashed var(--amber);background:rgba(240,167,58,.18)}
.sem7{display:flex;justify-content:space-between;margin:8px 0 14px}.j7{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mist)}.pt{width:26px;height:26px;border-radius:50%;background:rgba(247,234,210,.06)}.pt.v{background:var(--amber)}.pt.s{background:var(--sage)}.pt.f{background:transparent;border:1px dashed rgba(247,234,210,.18)}.pq{font-family:var(--sans);font-style:normal;font-size:13px;color:var(--mist);text-decoration:underline;margin-left:6px}
.catl.alc{border-left:3px solid var(--amber);padding-left:12px;margin-left:-15px;background:rgba(240,167,58,.07)}.catl.alc .k{font-size:21px}.catl.alc .v{font-size:30px;color:var(--amber)}.toutcompris{font-size:14px;color:var(--mist);text-align:right;padding-top:10px}
.poste{padding:9px 0}.pl{display:flex;justify-content:space-between;align-items:baseline}.pn{font-family:var(--serif);font-size:19px}.pn small{font-family:var(--sans);font-size:14px;color:var(--mist);margin-left:4px}.pv{font-family:var(--serif);font-weight:300;font-size:20px;white-space:nowrap}.pb{height:6px;background:rgba(247,234,210,.06);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:3px}
.pas{font-family:var(--serif);font-style:italic;font-weight:300;font-size:18px;color:var(--mist);line-height:1.5}
.pas b{color:var(--foam);font-weight:500;font-style:normal}
.btn{display:inline-block;padding:11px 16px;border:1px solid var(--amber);color:var(--amber);border-radius:3px;font-size:17px;font-weight:500}
.btn.plein{background:var(--amber);color:var(--night)}
.btn.discret{border-color:var(--line);color:var(--mist)}
.btn.danger{border-color:rgba(233,138,107,.5);color:var(--coral)}
/* réglages */
.reg h2{font-family:var(--serif);font-weight:300;font-size:30px;padding:0 26px}
.reg .bloc p.aide{font-size:14px;color:var(--mist);line-height:1.5;margin:6px 0 10px}
.champ{display:flex;align-items:center;gap:10px;margin:8px 0}
.champ label{flex:1;font-size:17px}
.champ input[type=number]{width:110px;text-align:right}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:17px}
.check input{width:20px;height:20px;accent-color:var(--amber)}
.rl{display:flex;width:100%;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:18px}
.rl small{color:var(--mist);font-size:14px}
.rl.cache{opacity:.45}
.cath{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.cath b{font-family:var(--serif);font-weight:500;font-size:22px}
.cath button{font-size:14px;color:var(--mist)}
.ajout{font-size:16px;color:var(--amber);padding:10px 0}
/* feuilles */
.voile{position:fixed;inset:0;background:rgba(5,10,20,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.voile.on{display:flex}
.feuille{width:100%;max-width:480px;background:var(--night3);border-radius:18px 18px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow-y:auto;animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:.4}}
.feuille h4{font-family:var(--serif);font-weight:300;font-size:26px}
.feuille .sous{font-size:14px;color:var(--mist);margin-top:2px}
.ecran{font-family:var(--serif);font-weight:300;font-size:52px;text-align:center;margin:14px 0 6px;min-height:60px}
.ecran i{font-style:italic;font-size:29px;color:var(--amber)}
.clavier{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.clavier button{padding:15px 0;font-size:24px;font-family:var(--serif);border:1px solid var(--line);border-radius:6px;background:rgba(247,234,210,.03)}
.clavier button:active{background:rgba(240,167,58,.2)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1;text-align:center}
.alerte{background:var(--coral);color:var(--night);font-size:16px;padding:10px 26px;display:none}
.alerte.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--foam);color:var(--night);font-size:16px;padding:9px 14px;border-radius:20px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.jsel{display:flex;align-items:center;gap:4px;margin-left:-8px}
.jsel button{width:34px;height:30px;font-size:22px;color:var(--mist);line-height:1}
.jsel button:disabled{opacity:.2}
.passe{margin:14px 22px 0;padding:11px 14px;border-radius:8px;background:rgba(240,167,58,.14);border:1px solid rgba(240,167,58,.45);font-size:15px;line-height:1.4;display:flex;justify-content:space-between;align-items:center;gap:10px}
.passe button{color:var(--amber);font-size:14px;text-decoration:underline;flex:none}
.coq{opacity:0;animation:coqTombe .6s ease-out forwards}
@keyframes coqTombe{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.epargne{color:var(--sage);font-family:var(--serif);font-style:italic;font-size:17px;margin-top:4px}
.tirelire{margin:18px 26px 0;padding:14px 16px;border:1px solid rgba(127,183,164,.35);border-radius:8px;background:rgba(127,183,164,.06)}
.tirelire .m{font-family:var(--serif);font-weight:300;font-size:34px;color:var(--sage);line-height:1;margin-top:4px}
.tirelire .m i{font-style:italic;font-size:.55em;color:var(--sage)}
.tirelire p{font-size:14px;color:var(--mist);margin-top:6px;line-height:1.45}
.bon{margin:16px 0 4px;padding:20px 18px;border:1.5px dashed var(--sand2);border-radius:10px;background:rgba(239,223,187,.07);text-align:center}
.bon .t{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand2)}
.bon .n{font-family:var(--serif);font-size:26px;margin:8px 0 2px}
.bon .v{font-family:var(--serif);font-weight:300;font-size:40px;color:var(--amber)}
.bon .d{font-size:14px;color:var(--mist);margin-top:6px}
.cookie-phrase{font-family:var(--serif);font-style:italic;font-weight:300;font-size:22px;line-height:1.35;margin:14px 0 10px}
.bonl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.bonl .k{font-family:var(--serif);font-size:18px}
.bonl .k small{display:block;font-family:var(--sans);font-size:13px;color:var(--mist)}
.bonl .btn{padding:8px 10px;font-size:13px;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:confetti 2.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confetti{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
/* ouverture : des billets tombent dans le bocal */
.splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 60% at 50% 20%,var(--night3),var(--night) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash svg{width:210px;height:330px;overflow:visible}
.sp-lid{transform-box:view-box;transform-origin:58px 78px;animation:couvercle 2.4s .1s ease-in-out both}
@keyframes couvercle{0%{transform:none}14%,78%{transform:translate(-16px,-34px) rotate(-22deg)}92%,100%{transform:none}}
.sp-note{transform-box:view-box;opacity:0;animation:billet 1.05s cubic-bezier(.45,.05,.6,1) both}
@keyframes billet{0%{opacity:0;transform:translate(var(--x),-150px) rotate(var(--r))}12%{opacity:1}70%{opacity:1;transform:translate(0,98px) rotate(var(--r2)) scale(.92)}100%{opacity:0;transform:translate(0,190px) rotate(var(--r2)) scale(.45)}}
.sp-sable{transform-box:view-box;animation:monteSable 2s .55s cubic-bezier(.3,.7,.3,1) both}
@keyframes monteSable{0%{transform:translateY(95px)}25%{transform:translateY(80px)}50%{transform:translateY(58px)}75%{transform:translateY(40px)}100%{transform:translateY(26px)}}
.splash-nom{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1;opacity:0;transform:translateY(8px);animation:nomEntre .7s 2s ease-out forwards}
.splash-nom i{font-style:italic;font-size:29px;color:var(--amber);margin-right:6px}
.splash-sous{font-family:var(--serif);font-style:italic;font-weight:300;font-size:17px;color:var(--mist);opacity:0;animation:nomEntre .7s 2.25s ease-out forwards}
@keyframes nomEntre{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sp-lid,.sp-note,.sp-sable,.splash-nom,.splash-sous{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
 <svg viewBox="0 0 190 360">
  <defs>
   <clipPath id="sp-c"><path transform="translate(0 60)" d="M64 40 C34 44 24 58 24 86 V262 C24 280 36 290 54 290 H136 C154 290 166 280 166 262 V86 C166 58 156 44 126 40 Z"/></clipPath>
   <linearGradient id="sp-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efdfbb"/><stop offset="1" stop-color="#cdb078"/></linearGradient>
   <g id="sp-b"><rect x="-30" y="-16" width="60" height="32" rx="3"/><rect x="-26" y="-12" width="52" height="24" rx="2" fill="none" stroke="#0f1d33" stroke-opacity=".25"/><circle cx="-12" cy="0" r="7" fill="#0f1d33" fill-opacity=".15"/><text x="12" y="6" font-family="Fraunces,Georgia,serif" font-size="15" fill="#0f1d33" fill-opacity=".55" text-anchor="middle">€</text></g>
  </defs>
  <g clip-path="url(#sp-c)"><g class="sp-sable"><path d="M0 260 Q47 252 95 260 T190 260 V420 H0Z" fill="url(#sp-s)"/><path d="M118 318 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z" fill="#e9b7a6"/></g></g>
  <g transform="translate(95 0)">
   <use href="#sp-b" class="sp-note" fill="#b9c6e4" style="--x:-40px;--r:-25deg;--r2:-8deg;animation-delay:.45s"/>
   <use href="#sp-b" class="sp-note" fill="#e9b7a6" style="--x:46px;--r:30deg;--r2:10deg;animation-delay:.8s"/>
   <use href="#sp-b" class="sp-note" fill="#c9dcc4" style="--x:-18px;--r:-40deg;--r2:6deg;animation-delay:1.15s"/>

<script>
// LOGIQUE-DEBUT
const H5 = 5 * 3600 * 1000;
function deux(n) { return String(n).padStart(2, '0'); }
function cleDate(d) { return d.getFullYear() + '-' + deux(d.getMonth() + 1) + '-' + deux(d.getDate()); }
function dateDeCle(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
// La journée va de 5 h à 5 h : un verre à 2 h du matin appartient à la soirée de la veille.
function cleJour(ts) { return cleDate(new Date(ts - H5)); }
function cleSemaine(k) { const d = dateDeCle(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return cleDate(d); }
function ajouterJours(k, n) { const d = dateDeCle(k); d.setDate(d.getDate() + n); return cleDate(d); }
function arr(x) { return Math.round(x * 100) / 100; }
const RE_BIERE = /bi[eè]re|pinte|demi/i;
function resume(entrees, pred, cigParPaquet) {
  const r = { total: 0, verres: 0, std: 0, bieres: 0, paquets: 0, prixPaquets: 0, clopes: 0, cigarettes: 0, estime: false, soirsAlcool: 0, sorties: 0, parCat: {}, n: 0 };
  const joursAlcool = new Set(), joursSortie = new Set();
  for (const e0 of entrees) {
    const e = Object.assign({}, e0, { jour: cleJour(e0.t) });
    if (!pred(e)) continue;
    const q = e.qte || 1;
    r.n++;
    r.total += e.prix || 0;
    if (e.alcool) { r.verres += q; r.std += (e.std || 1) * q; joursAlcool.add(e.jour); if (RE_BIERE.test(e.nom)) r.bieres += q; }
    if (e.paquet) { r.paquets += q; r.prixPaquets += e.prix || 0; }
    if (e.clope) r.clopes += q;
    if (e.cat === 'bar' || e.cat === 'autrement') joursSortie.add(e.jour);
    const c = r.parCat[e.cat] || (r.parCat[e.cat] = { total: 0, qte: 0, articles: {} });
    c.total += e.prix || 0; c.qte += q;
    const a = c.articles[e.nom] || (c.articles[e.nom] = { qte: 0, total: 0 });
    a.qte += q; a.total += e.prix || 0;
  }
  r.total = arr(r.total);
  for (const k in r.parCat) { r.parCat[k].total = arr(r.parCat[k].total); for (const a in r.parCat[k].articles) r.parCat[k].articles[a].total = arr(r.parCat[k].articles[a].total); }
  // les clopes comptées une à une priment ; sinon on estime à partir des paquets
  r.estime = !r.clopes;
  r.cigarettes = r.clopes || r.paquets * (cigParPaquet || 20);
  r.prixClope = r.paquets ? arr(r.prixPaquets / (r.paquets * (cigParPaquet || 20))) : 0;
  r.soirsAlcool = joursAlcool.size;
  r.sorties = joursSortie.size;
  return r;
}
function calendrier(entrees, ym) {
  const c = {};
  for (const e of entrees) {
    const j = cleJour(e.t);
    if (!j.startsWith(ym)) continue;
    const d = c[j] || (c[j] = { verres: 0, autrement: false, total: 0 });
    if (e.alcool) d.verres += e.qte || 1;
    if (e.cat === 'autrement') d.autrement = true;
    d.total += e.prix || 0;
  }
  return c;
}
function santeSemaine(entrees, cleRef) {
  const lundi = cleSemaine(cleRef);
  const parJour = {};
  for (const e of entrees) {
    if (!e.alcool) continue;
    const j = cleJour(e.t);
    if (j < lundi || j > cleRef) continue;
    parJour[j] = (parJour[j] || 0) + (e.std || 1) * (e.qte || 1);
  }
  let std = 0, maxJour = 0;
  for (const j in parJour) { std += parJour[j]; maxJour = Math.max(maxJour, parJour[j]); }
  let ecoules = 0, k = lundi;
  while (k <= cleRef && ecoules < 7) { ecoules++; k = ajouterJours(k, 1); }
  return { std, maxJour, joursSans: ecoules - Object.keys(parJour).length, joursEcoules: ecoules };
}
function euros(x, entier) {
  const neg = x < 0; x = Math.abs(x);
  let s = entier ? String(Math.round(x)) : x.toFixed(2);
  let [e, d] = s.split('.');
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '-' : '') + e + (d ? ',' + d : '') + ' €';
}
const MOTS = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix'];
function nombre(n, g) { if (n === 1) return g === 'f' ? 'une' : 'un'; return n <= 10 ? MOTS[n] : String(n); }
function pluriel(nom) {
  const i = nom.indexOf(' ');
  const m = i < 0 ? nom : nom.slice(0, i), reste = i < 0 ? '' : nom.slice(i);
  let p;
  if (/[sxz]$/i.test(m)) p = m;
  else if (/(eu|au)$/i.test(m)) p = m + 'x';
  else if (/al$/i.test(m)) p = m.slice(0, -2) + 'aux';
  else p = m + 's';
  // les adjectifs en -é / -ée suivent : tarte flambée → tartes flambées
  return p + reste.replace(/(\S+?)(é|ée)(?=\s|$)/g, '$1$2s');
}
function choisirEnvies(montant, envies) {
  return envies.filter(v => v.prix > 0).map(v => Object.assign({}, v, { n: Math.floor(montant / v.prix) })).filter(v => v.n >= 1 && v.n <= 10);
}
function phraseEnvie(montant, v) {
  const n = Math.floor(montant / v.prix);
  return euros(montant, true) + ", c'est " + nombre(n, v.g) + ' ' + (n > 1 ? pluriel(v.nom) : v.nom) + '.';
}
// Récompenses : un soir est « libre » s'il est passé (avant aujourd'hui), après la première saisie, et sans aucun verre.
function joursAlcool(entrees) { const s = new Set(); entrees.forEach(e => { if (e.alcool) s.add(cleJour(e.t)); }); return s; }
function premierJour(entrees) { return entrees.reduce((m, e) => { const j = cleJour(e.t); return j < m ? j : m; }, '9999'); }
function soirsLibres(entrees, auj) {
  if (!entrees.length) return [];
  const al = joursAlcool(entrees), r = [];
  for (let k = premierJour(entrees); k < auj; k = ajouterJours(k, 1)) if (!al.has(k)) r.push(k);
  return r;
}
// Le prix d'une soirée avec un verre, mesuré sur ses propres soirées (12 € tant qu'il y en a moins de 3).
function prixSoiree(entrees) {
  const parJour = {};
  entrees.forEach(e => { if (e.alcool) { const j = cleJour(e.t); parJour[j] = (parJour[j] || 0) + (e.prix || 0); } });
  const v = Object.values(parJour).filter(x => x > 0);
  if (v.length < 3) return 12;
  return arr(v.reduce((a, b) => a + b, 0) / v.length);
}
function epargne(entrees, bons, auj) {
  const brut = soirsLibres(entrees, auj).length * prixSoiree(entrees);
  return arr(Math.max(0, brut - (bons || []).reduce((a, b) => a + b.montant, 0)));
}
// Les semaines (lundi à dimanche) entièrement passées et entièrement libres.
function semainesLibres(entrees, auj) {
  const libres = new Set(soirsLibres(entrees, auj)), r = [];
  if (!entrees.length) return r;
  for (let l = cleSemaine(premierJour(entrees)); ajouterJours(l, 6) < auj; l = ajouterJours(l, 7)) {
    let ok = true;
    for (let i = 0; i < 7; i++) if (!libres.has(ajouterJours(l, i))) { ok = false; break; }
    if (ok) r.push(l);
  }
  return r;
}
// LOGIQUE-FIN

/* ---------- données ---------- */
const CLE = 'bocal-v1';
const ENVIES = [
  { nom: 'nuit au bord de la mer', g: 'f', prix: 80 }, { nom: 'resto à deux', g: 'm', prix: 60 },
  { nom: 'place de concert', g: 'f', prix: 45 }, { nom: 'séance de ciné', g: 'f', prix: 12 },
  { nom: 'livre', g: 'm', prix: 20 }, { nom: 'massage', g: 'm', prix: 60 },
  { nom: 'plein pour le van', g: 'm', prix: 90 }, { nom: 'jeu PS5', g: 'm', prix: 70 },
  { nom: 'cours de chant', g: 'm', prix: 40 }, { nom: 'soirée au théâtre', g: 'f', prix: 30 },
  { nom: 'soin pour les cheveux', g: 'm', prix: 20 }, { nom: 'tee-shirt', g: 'm', prix: 25 }];
function art(id, nom, o) { return Object.assign({ id, nom, prix: null, recents: [], alcool: false, std: 1, paquet: false, demander: false, cache: false }, o || {}); }
function depart() {
  return {
    v: 1, intro: true,
    cats: [
      { id: 'bar', nom: 'Au bar ou au café', cache: false, articles: [art('biere', 'Bière', { alcool: true }), art('cafe', 'Café'), art('tarte', 'Tarte flambée'), art('bretzel', 'Bretzel'), art('soft', 'Soft ou sans alcool'), art('autrebar', 'Autre', { demander: true })] },
      { id: 'autrement', nom: 'Sortir autrement', cache: false, articles: [art('resto', 'Resto', { demander: true }), art('cine', 'Ciné', { demander: true }), art('concert', 'Concert ou théâtre', { demander: true }), art('autresortie', 'Autre', { demander: true })] },
      { id: 'maison', nom: 'À la maison', cache: false, articles: [art('verre', 'Verre', { alcool: true, prix: 0 })] },
      { id: 'courses', nom: 'Courses', cache: false, articles: [art('superu', 'Super U', { demander: true }), art('maximat', 'Maximat', { demander: true }), art('noel', 'Marché de Noël', { demander: true })] },
      { id: 'tabac', nom: 'Tabac', cache: false, articles: [art('paquet', 'Paquet', { paquet: true }), art('clope', 'Clope', { clope: true, prix: 0 }), art('jeux', 'Jeux', { demander: true })] }],
    entrees: [], bons: [], fetes: [],
    reglages: { repere: 50, catsBocal: ['alcool'], cigParPaquet: 20, envies: ENVIES.map(e => Object.assign({}, e)) }
  };
}
let S, stockageOk = true;
function charger() {
  try { const t = localStorage.getItem(CLE); S = t ? JSON.parse(t) : depart(); }
  catch (e) { S = depart(); stockageOk = false; }
  if (!S.reglages) S.reglages = depart().reglages;
  // v6 : le bocal compte l'alcool seulement. On ne change que les réglages de départ jamais touchés.
  if (!S.migAlcool) {
    const R = S.reglages;
    if (R.repere === 100 && R.catsBocal.length === 1 && R.catsBocal[0] === 'bar') { R.catsBocal = ['alcool']; R.repere = 50; }
    S.migAlcool = true;
  }
  // v8 : le bouton Clope (une cigarette fumée, déjà payée avec le paquet)
  if (!S.migClope) {
    const t = S.cats.find(c => c.id === 'tabac');
    if (t && !t.articles.some(a => a.clope)) t.articles.splice(1, 0, art('clope', 'Clope', { clope: true, prix: 0 }));
    S.migClope = true;
  }
  // v12 : l'onglet s'appelle « Au bar ou au café » (seulement s'il n'a pas été renommé à la main)
  const cb = S.cats.find(c => c.id === 'bar'); if (cb && cb.nom === 'Au bar ou dehors') cb.nom = 'Au bar ou au café';
  if (!S.migAlcool2) { const R = S.reglages; if (R.catsBocal.length === 1 && R.catsBocal[0] === 'bar') R.catsBocal = ['alcool']; S.migAlcool2 = true; }
  // v9 : les récompenses
  if (!S.migRecomp) {
    S.bons = S.bons || []; S.fetes = S.fetes || [];
    [{ nom: 'soin pour les cheveux', g: 'm', prix: 20 }, { nom: 'tee-shirt', g: 'm', prix: 25 }].forEach(v => { if (!S.reglages.envies.some(x => x.nom === v.nom)) S.reglages.envies.push(v); });
    // les semaines déjà passées ne déclenchent pas de confettis rétroactifs
    S.fetes = S.fetes.concat(semainesLibres(S.entrees, cleJour(Date.now())));
    S.migRecomp = true;
  }
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(S)); stockageOk = true; }
  catch (e) { stockageOk = false; }
  document.getElementById('alerte').classList.toggle('on', !stockageOk);
}
charger();

/* ---------- outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function aujourdhui() { return cleJour(Date.now()); }
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function dateCourte(k) { const d = dateDeCle(k); return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_C[d.getMonth()]; }
function heure(ts) { const d = new Date(ts); return deux(d.getHours()) + ':' + deux(d.getMinutes()); }
function cat(id) { return S.cats.find(c => c.id === id); }
function article(cid, aid) { const c = cat(cid); return c && c.articles.find(a => a.id === aid); }
function nomCB() { return (S.reglages.nomCB || 'CB Attos').trim() || 'CB Attos'; }
function verresMots(n) { return n === 0 ? 'aucun verre' : nombre(n, 'm') + (n > 1 ? ' verres' : ' verre'); }
function bigNum(x) { const e = Math.round(x); const exact = Math.abs(x - e) < 0.005; return (exact ? String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : x.toFixed(2).replace('.', ',')) + '<i>€</i>'; }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
function feuille(html) { $('#feuille').innerHTML = html; $('#voile').classList.add('on'); }
function fermer() { $('#voile').classList.remove('on'); }
$('#voile').addEventListener('click', e => { if (e.target.id === 'voile') fermer(); });

/* ---------- le bocal ---------- */
const CORPS = 'M64 40 C34 44 24 58 24 86 V262 C24 280 36 290 54 290 H136 C154 290 166 280 166 262 V86 C166 58 156 44 126 40 Z';
let nb = 0;
function bocalSVG(montant, repere, mini, deco) {
  nb++;
  const haut = 70, bas = 290, plage = bas - haut;
  const echelle = repere > 0 ? Math.max(repere * 1.25, montant * 1.04) : Math.max(montant * 1.25, 40);
  const niveau = bas - plage * Math.min(1, montant / echelle);
  const yRep = repere > 0 ? bas - plage * (repere / echelle) : null;
  const vague = y => `M0 ${y} Q47 ${y - 8} 95 ${y} T190 ${y}`;
  const corail = yRep !== null && montant > repere ? `<path d="${vague(niveau)} V${yRep} H0Z" fill="#e98a6b"/>` : '';
  const sw = mini ? 6 : 1.6;
  const vide = montant <= 0 ? 'opacity="0"' : '';
  const decal = mini ? 0 : bas - niveau + 10;
  return `<svg ${mini ? 'width="48" height="76" viewBox="0 0 190 300"' : 'width="236" height="300" viewBox="0 0 236 300"'} aria-hidden="true">
   <defs><clipPath id="c${nb}"><path d="${CORPS}"/></clipPath>
   <linearGradient id="s${nb}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efdfbb"/><stop offset="1" stop-color="#cdb078"/></linearGradient>
   <pattern id="g${nb}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#9c7f4c" opacity=".45"/><circle cx="4.5" cy="4" r=".6" fill="#fff" opacity=".45"/></pattern></defs>
   <g clip-path="url(#c${nb})"><g class="sable" ${vide} style="transform:translateY(${decal}px)" data-final="0">
    <path d="${vague(niveau)} V300 H0Z" fill="url(#s${nb})"/>${corail}
    ${mini ? '' : `<path d="${vague(niveau)} V300 H0Z" fill="url(#g${nb})"/>`}
   </g></g>
   ${!mini && deco ? `<g clip-path="url(#c${nb})">${decoBocal(deco)}</g>` : ''}
   ${yRep !== null && !mini ? `<line x1="26" y1="${yRep}" x2="164" y2="${yRep}" stroke="#f7ead2" stroke-width="1.4" stroke-dasharray="5 4" opacity=".75"/>
   <text x="172" y="${yRep - 2}" fill="#8ea1bf" font-family="Work Sans,sans-serif" font-size="13">repère</text>
   <text x="172" y="${yRep + 12}" fill="#8ea1bf" font-family="Work Sans,sans-serif" font-size="13">${euros(repere, true)}</text>` : ''}
   ${yRep !== null && mini ? `<line x1="30" y1="${yRep}" x2="160" y2="${yRep}" stroke="#f7ead2" stroke-width="5" stroke-dasharray="14 10" opacity=".6"/>` : ''}
   <path d="${CORPS}" fill="rgba(247,234,210,.04)" stroke="#f7ead2" stroke-width="${sw}"/>
   <rect x="58" y="10" width="74" height="16" rx="3" fill="none" stroke="#f7ead2" stroke-width="${sw}"/>
   <path d="M64 26 V40 M126 26 V40" stroke="#f7ead2" stroke-width="${sw}"/>
  </svg>`;
}
function decoBocal(d) {
  // positions stables : le même coquillage reste au même endroit d'une ouverture à l'autre
  const COUL = ['#f7ead2', '#e9b7a6', '#9fc9b9', '#f3d9a4'];
  let h = '';
  for (let i = 0; i < Math.min(d.coquillages, 40); i++) {
    const x = 42 + ((i * 37) % 104), y = 284 - ((i * 23) % 6) * 4 - Math.floor(i / 10) * 7, r = ((i * 47) % 50) - 25;
    h += `<g transform="translate(${x} ${y}) rotate(${r})"><g class="coq" style="animation-delay:${1.1 + i * 0.06}s"><path d="M-6 0 Q0 -11 6 0 Z" fill="${COUL[i % 4]}"/><path d="M0 0 L0 -8 M-3 0 L-1.5 -7 M3 0 L1.5 -7" stroke="#0f1d33" stroke-opacity=".25" stroke-width=".8"/></g></g>`;
  }
  for (let i = 0; i < d.etoiles; i++) {
    const x = 60 + ((i * 41) % 70), y = 262 - i * 6;
    h += `<g transform="translate(${x} ${y}) scale(1.6)"><path class="coq" style="animation-delay:${1.6 + i * 0.2}s" d="M0 -6 L1.8 -1.8 6 -1.2 2.8 1.8 3.6 6 0 3.8 -3.6 6 -2.8 1.8 -6 -1.2 -1.8 -1.8Z" fill="#e98a6b"/></g>`;
  }

}
function animerSable(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll('.sable').forEach(g => g.style.transform = 'translateY(0)')));
}
function depenseBocal(pred) {
  const cs = S.reglages.catsBocal;
  // « alcool » = tous les articles marqués alcool, où qu'ils soient (bières, vin chaud...), sans les cafés ni les bretzels
  return resume(S.entrees, e => pred(e) && ((cs.includes('alcool') && e.alcool) || cs.includes(e.cat)), S.reglages.cigParPaquet).total;
}

/* ---------- saisie ---------- */
let catCourante = 'bar', derniere = null;
let jourSaisie = null; // null = aujourd'hui ; sinon la clé d'un jour passé
function heurePour(k) {
  const n = S.entrees.filter(e => cleJour(e.t) === k).length;
  const d = dateDeCle(k); d.setHours(21, n, 0, 0);
  return d.getTime();

  const s = santeSemaine(S.entrees, refS);
  const lundi = cleSemaine(refS);
  const debutS = S.entrees.length ? S.entrees.reduce((m, e) => { const j = cleJour(e.t); return j < m ? j : m; }, '9999') : auj;
  const cal7 = {};
  S.entrees.forEach(e => { if (e.alcool) { const j = cleJour(e.t); cal7[j] = true; } });
  const jours7 = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x, i) => {
    const k = ajouterJours(lundi, i);
    const cl = k > refS ? 'f' : k < debutS ? '' : cal7[k] ? 'v' : 's';
    return `<div class="j7"><span class="pt ${cl}"></span><span>${x}</span></div>`;
  }).join('');
  const ronds = Array.from({ length: Math.max(10, s.std) }, (_, i) => `<i class="${i < Math.min(s.std, 10) ? 'f' : i < s.std ? 'x' : ''}"></i>`).join('');
  h += `<div class="bloc"><h3>Ma semaine</h3><div class="sem7">${jours7}</div>
   <div class="ronds">${ronds}</div>
   <div class="pas"><b>${s.std}</b> verre${s.std > 1 ? 's' : ''} sur 10 cette semaine <button class="pq" id="pourquoi10">pourquoi 10 ?</button></div></div>`;
  // ce que je m'offre
  if ((S.bons || []).length) {
    h += `<div class="bloc"><h3>Ce que je m'offre</h3>${S.bons.slice().reverse().map(b => {
      const etat = auj < b.valable ? `<small>valable dès ${dateCourte(b.valable)}</small>` : b.offert ? `<small>offert le ${dateCourte(b.offert)}</small>` : '<small>à toi</small>';
      const btn = auj >= b.valable && !b.offert ? `<button class="btn" data-bon="${b.id}">C'est fait</button>` : '';
      return `<div class="bonl"><span class="k">${nombre(1, b.g)} ${esc(b.nom)} · ${euros(b.montant, true)}${etat}</span>${btn}</div>`;
    }).join('')}</div>`;
  }
  // à rembourser
  const parQui = f => arr(S.entrees.filter(e => f(e) && B.pred(Object.assign({}, e, { jour: cleJour(e.t) }))).reduce((x, e) => x + (e.prix || 0), 0));
  const cbPer = parQui(e => e.cb), espPer = parQui(e => e.esp);
  if (cbPer > 0 || espPer > 0) h += `<div class="bloc"><h3>Qui a payé</h3>${cbPer > 0 ? `<div class="catl"><span class="k">${esc(nomCB())}</span><span class="v">${euros(cbPer)}</span></div>` : ''}${espPer > 0 ? `<div class="catl"><span class="k">En espèces</span><span class="v">${euros(espPer)}</span></div>` : ''}</div>`;
  const dus = S.entrees.filter(e => e.carte && !e.rembourse && !e.offerte);
  if (dus.length) {
    const tot = arr(dus.reduce((x, e) => x + e.prix, 0));
    h += `<div class="bloc"><h3>Payé avec ma carte</h3><div class="pas">À me faire rembourser : <b>${euros(tot)}</b> (${dus.length} saisie${dus.length > 1 ? 's' : ''}).</div><div style="margin-top:10px"><button class="btn" id="rembourse">C'est remboursé</button></div></div>`;
  }
  $('#bilan').innerHTML = h;
  animerSable($('#bilan'));
  const p10 = $('#pourquoi10'); if (p10) p10.onclick = () => { pv = null; feuille(`<h4>Pourquoi 10 ?</h4><div class="pas" style="margin-top:12px">C'est le repère de Santé publique France pour garder un risque bas : <b>10 verres par semaine au plus</b>, pas plus de 2 dans la journée, et des soirs libres.<br><br>Un demi, c'est 1 verre. Une pinte, 2.</div><div class="actions"><button class="btn discret" onclick="fermer()">Fermer</button></div>`); };
  document.querySelectorAll('[data-bon]').forEach(b => b.onclick = () => { const x = S.bons.find(y => y.id === b.dataset.bon); if (x) { x.offert = aujourdhui(); sauver(); toast('Profites-en'); rendreBilan(); } });
  const ev = $('#envie'); if (ev) ev.onclick = () => { envieIdx++; rendreBilan(); };
  const rb = $('#rembourse'); if (rb) rb.onclick = () => { if (!confirm('Marquer ' + dus.length + ' saisie(s) comme remboursée(s) ?')) return; dus.forEach(e => e.rembourse = true); sauver(); rendreBilan(); };
}
function calendrierHTML(ym, auj) {
  const c = calendrier(S.entrees, ym);
  const [y, m] = ym.split('-').map(Number);
  const premier = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let g = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<div class="h">${x}</div>`).join('');
  for (let i = 0; i < premier; i++) g += '<div class="d e"></div>';
  let nVerre = 0, nLibre = 0;
  const debut = S.entrees.length ? S.entrees.reduce((m, e) => { const j = cleJour(e.t); return j < m ? j : m; }, '9999') : auj;
  for (let d = 1; d <= n; d++) {
    const k = ym + '-' + deux(d), j = c[k];
    let cl = '';
    if (k > auj) cl = 'f';
    else if (k < debut) cl = '';
    else if (j && j.verres) { cl = 'v3'; nVerre++; }
    else { cl = 's'; nLibre++; }
    if (k === auj) cl += ' today';
    g += `<div class="d ${cl}" style="animation-delay:${d * 40}ms">${d}</div>`;
  }
  return `<div class="bloc"><h3>Le mois, soir après soir</h3><div class="cal">${g}</div><div class="leg"><span><i style="background:#f0a73a"></i>un verre : ${nVerre} soir${nVerre > 1 ? 's' : ''}</span><span><i style="background:var(--sage)"></i>libre : ${nLibre} soir${nLibre > 1 ? 's' : ''}</span></div></div>`;
}
$('#b-tabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; vue.k = b.dataset.k; rendreBilan(); });
$('#b-prec').onclick = () => { vue.ref = bornes().prec; envieIdx = 0; rendreBilan(); };
$('#b-suiv').onclick = () => { const s = bornes().suiv, a = aujourdhui(); vue.ref = s > a ? a : s; envieIdx = 0; rendreBilan(); };

/* ---------- réglages ---------- */
function rendreReglages() {
  const R = S.reglages;
  let h = `<div class="bloc"><h3>Mon repère</h3><p class="aide">Le trait sur le bocal. Facultatif : mets 0 pour ne pas en avoir. Il compte par mois ; sur une semaine, l'appli prend la part d'une semaine.</p>
   <div class="champ"><label for="r-rep">Par mois</label><input type="number" id="r-rep" inputmode="decimal" min="0" value="${R.repere || 0}"></div>
   <p class="aide">Ce qui remplit le bocal :</p>
   <label class="check"><input type="checkbox" data-bc="alcool" ${R.catsBocal.includes('alcool') ? 'checked' : ''}>L'alcool seulement (bières, verres, partout)</label>
   ${S.cats.map(c => `<label class="check"><input type="checkbox" data-bc="${c.id}" ${R.catsBocal.includes(c.id) ? 'checked' : ''}>${esc(c.nom)}</label>`).join('')}</div>`;
  h += `<div class="bloc"><h3>Mes articles</h3><p class="aide">Touche un article pour changer son nom, son prix, ou dire s'il contient de l'alcool.</p>`;
  for (const c of S.cats) {
    h += `<div class="cath"><b>${esc(c.nom)}</b><span><button data-rc="${c.id}">renommer</button> · <button data-hc="${c.id}">${c.cache ? 'afficher' : 'masquer'}</button></span></div>`;
    h += c.articles.map(a => `<button class="rl${a.cache ? ' cache' : ''}" data-ea="${c.id}|${a.id}"><span>${esc(a.nom)} ${a.alcool ? `<small>· alcool, ${a.std} verre${a.std > 1 ? 's' : ''} std</small>` : ''}${a.paquet ? '<small>· paquet</small>' : ''}</span><small>${a.demander ? 'montant à chaque fois' : a.prix === null ? 'prix au 1er toucher' : euros(a.prix)}</small></button>`).join('');
    h += `<button class="ajout" data-aa="${c.id}">+ ajouter un article</button>`;
  }
  h += `<div style="margin-top:8px"><button class="ajout" id="add-cat">+ ajouter une catégorie</button></div></div>`;
  h += `<div class="bloc"><h3>Ce qu'on pourrait faire à la place</h3><p class="aide">Les envies du bilan. Une phrase est tirée au hasard parmi celles que le montant permet.</p>
   ${R.envies.map((v, i) => `<button class="rl" data-ev="${i}"><span>${nombre(1, v.g)} ${esc(v.nom)}</span><small>${euros(v.prix, true)}</small></button>`).join('')}
   <button class="ajout" id="add-env">+ ajouter une envie</button></div>`;
  h += `<div class="bloc"><h3>Qui a payé</h3><p class="aide">L'étiquette à côté de « ma carte ». Sur le téléphone d'Attos, mets par exemple « CB Aurore ».</p><div class="champ"><label for="r-cb">Nom</label><input id="r-cb" value="${esc(nomCB())}" style="width:160px"></div></div>`;
  h += `<div class="bloc"><h3>Cigarettes</h3><div class="champ"><label for="r-cig">Cigarettes par paquet</label><input type="number" id="r-cig" min="1" value="${R.cigParPaquet}"></div></div>`;
  h += `<div class="bloc"><h3>Sauvegarde</h3><p class="aide">Tes données sont seulement sur ce téléphone. Si tu supprimes l'appli ou les données de Safari, elles disparaissent. Garde une sauvegarde de temps en temps (dans Fichiers ou par mail).</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="exp">Enregistrer une sauvegarde</button><button class="btn discret" id="imp">Restaurer</button></div>
   <p class="aide" style="margin-top:14px">${S.entrees.length} saisie${S.entrees.length > 1 ? 's' : ''} enregistrée${S.entrees.length > 1 ? 's' : ''}.</p></div>`;
  h += `<div class="bloc"><p class="aide">Le Bocal v1 · marche hors ligne, sans compte, sans abonnement.</p></div>`;
  $('#reglages').innerHTML = h;
}
$('#reglages').addEventListener('change', ev => {
  const t = ev.target, R = S.reglages;
  if (t.id === 'r-rep') R.repere = Math.max(0, parseFloat(t.value) || 0);
  else if (t.id === 'r-cb') R.nomCB = t.value.trim() || 'CB Attos';
  else if (t.id === 'r-cig') R.cigParPaquet = Math.max(1, parseInt(t.value) || 20);
  else if (t.dataset.bc) { const id = t.dataset.bc; R.catsBocal = t.checked ? [...new Set(R.catsBocal.concat(id))] : R.catsBocal.filter(x => x !== id); }
  sauver(); toast('Enregistré');
});
$('#reglages').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.rc) { const c = cat(b.dataset.rc); const n = prompt('Nom de la catégorie', c.nom); if (n && n.trim()) { c.nom = n.trim(); sauver(); rendreReglages(); } }
  else if (b.dataset.hc) { const c = cat(b.dataset.hc); c.cache = !c.cache; sauver(); rendreReglages(); }
  else if (b.dataset.ea) { const [ci, ai] = b.dataset.ea.split('|'); editerArticle(cat(ci), article(ci, ai)); }
  else if (b.dataset.aa) { const c = cat(b.dataset.aa); const a = art(uid(), 'Nouvel article'); c.articles.push(a); sauver(); editerArticle(c, a, true); }
  else if (b.id === 'add-cat') { const n = prompt('Nom de la nouvelle catégorie'); if (n && n.trim()) { S.cats.push({ id: uid(), nom: n.trim(), cache: false, articles: [] }); sauver(); rendreReglages(); } }
  else if (b.dataset.ev) editerEnvie(Number(b.dataset.ev));
  else if (b.id === 'add-env') { S.reglages.envies.push({ nom: 'nouvelle envie', g: 'f', prix: 50 }); sauver(); editerEnvie(S.reglages.envies.length - 1); }
  else if (b.id === 'exp') exporter();
  else if (b.id === 'imp') $('#fichier').click();
});
function editerArticle(c, a, nouveau) {
  pv = null;
  feuille(`<h4>${nouveau ? 'Nouvel article' : esc(a.nom)}</h4><div class="sous">${esc(c.nom)}</div>
   <div class="champ" style="margin-top:14px"><label>Nom</label></div><input id="fa-nom" value="${esc(a.nom)}">
   <div class="champ"><label for="fa-prix">Prix habituel (vide = demandé au 1er toucher)</label><input type="number" id="fa-prix" inputmode="decimal" step="0.01" value="${a.prix === null ? '' : a.prix}"></div>
   <label class="check"><input type="checkbox" id="fa-dem" ${a.demander ? 'checked' : ''}>Taper le montant à chaque fois</label>
   <label class="check"><input type="checkbox" id="fa-alc" ${a.alcool ? 'checked' : ''}>Contient de l'alcool (compte comme un verre)</label>
   <div class="champ"><label for="fa-std">Verres standard (demi = 1, pinte = 2)</label><input type="number" id="fa-std" min="0.5" step="0.5" value="${a.std || 1}"></div>
   <label class="check"><input type="checkbox" id="fa-paq" ${a.paquet ? 'checked' : ''}>C'est un paquet de cigarettes</label>
   <label class="check"><input type="checkbox" id="fa-clo" ${a.clope ? 'checked' : ''}>C'est une cigarette fumée (comptée une par une)</label>
   <label class="check"><input type="checkbox" id="fa-cache" ${a.cache ? 'checked' : ''}>Masquer de l'écran de saisie</label>
   <div class="actions"><button class="btn danger" id="fa-sup">Supprimer</button><button class="btn plein" id="fa-ok">Enregistrer</button></div>`);
  $('#fa-ok').onclick = () => {
    a.nom = $('#fa-nom').value.trim() || a.nom;
    const p = $('#fa-prix').value; a.prix = p === '' ? null : arr(parseFloat(p) || 0);
    a.demander = $('#fa-dem').checked; a.alcool = $('#fa-alc').checked; a.std = parseFloat($('#fa-std').value) || 1;
    a.paquet = $('#fa-paq').checked; a.clope = $('#fa-clo').checked; a.cache = $('#fa-cache').checked;
    sauver(); fermer(); rendreReglages(); toast('Enregistré');
  };
  $('#fa-sup').onclick = () => { if (!confirm('Supprimer « ' + a.nom + ' » ? Les saisies déjà faites restent dans le bilan.')) return; c.articles = c.articles.filter(x => x !== a); sauver(); fermer(); rendreReglages(); };
}
function editerEnvie(i) {
  const v = S.reglages.envies[i];
  feuille(`<h4>Une envie</h4><div class="sous">Écris-la au singulier : « nuit au bord de la mer ».</div>
   <div class="champ" style="margin-top:14px"><label>Un ou une ?</label><select id="fe-g" style="width:110px"><option value="f" ${v.g === 'f' ? 'selected' : ''}>une</option><option value="m" ${v.g === 'm' ? 'selected' : ''}>un</option></select></div>
   <input id="fe-nom" value="${esc(v.nom)}">
   <div class="champ"><label for="fe-prix">Prix</label><input type="number" id="fe-prix" inputmode="decimal" value="${v.prix}"></div>
   <div class="actions"><button class="btn danger" id="fe-sup">Supprimer</button><button class="btn plein" id="fe-ok">Enregistrer</button></div>`);
  $('#fe-ok').onclick = () => { v.nom = $('#fe-nom').value.trim() || v.nom; v.g = $('#fe-g').value; v.prix = Math.max(1, parseFloat($('#fe-prix').value) || v.prix); sauver(); fermer(); rendreReglages(); };
  $('#fe-sup').onclick = () => { S.reglages.envies.splice(i, 1); sauver(); fermer(); rendreReglages(); };
}
async function exporter() {
  const nom = 'le-bocal-' + aujourdhui() + '.json';
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  try {
    const f = new File([blob], nom, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Sauvegarde du Bocal' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = nom; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
$('#fichier').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.entrees) || !Array.isArray(d.cats)) throw new Error('format');
    if (!confirm('Remplacer les données de ce téléphone par cette sauvegarde (' + d.entrees.length + ' saisies) ?')) return;
    S = d; if (!S.reglages) S.reglages = depart().reglages; sauver(); rendreTout(); toast('Sauvegarde restaurée');
  } catch (e) { alert("Ce fichier n'est pas une sauvegarde du Bocal."); }
  ev.target.value = '';
});

/* ---------- récompenses ---------- */
const PHRASES = [
  "Ce qui n'est pas parti en mousse est resté pour toi.",
  "Tes soirs libres ont fait des petits.",
  "La marée monte doucement dans ta tirelire.",
  "Petite marée, grand trésor.",
  "Ce soir-là, tu as dit non. Aujourd'hui, tu peux dire oui.",
  "Le meilleur verre, c'est parfois celui qu'on transforme en autre chose.",
  "Tu as semé des soirs tranquilles. Voilà la récolte.",
  "Ton futur toi te remercie. Ton toi d'aujourd'hui aussi.",
  "Un coquillage, ça ne s'achète pas. Ça se ramasse.",
  "Rien ne presse : ton cadeau t'attend dès demain.",
  "Il y a des soirs qui valent de l'or. Ceux-là en font partie.",
  "Plusieurs soirs, tu as pris soin de toi. Ça se fête."];
const hasard = l => l[Math.floor(Math.random() * l.length)];
function confettis() {
  const c = document.createElement('div'); c.className = 'confetti';
  const coul = ['#efdfbb', '#e98a6b', '#7fb7a4', '#f7ead2', '#f0a73a', '#e9b7a6'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = coul[i % coul.length];
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDelay = Math.random() * 0.6 + 's';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
}
function surprises() {
  if ($('#voile').classList.contains('on') || document.getElementById('splash')) return;
  const auj = aujourdhui();
  const nouvelles = semainesLibres(S.entrees, auj).filter(l => !S.fetes.includes(l));
  if (nouvelles.length) {
    S.fetes = S.fetes.concat(nouvelles); sauver(); confettis(); pv = null;
    feuille(`<div style="text-align:center"><svg width="80" height="80" viewBox="-8 -8 16 16"><path d="M0 -6 L1.8 -1.8 6 -1.2 2.8 1.8 3.6 6 0 3.8 -3.6 6 -2.8 1.8 -6 -1.2 -1.8 -1.8Z" fill="#e98a6b"/></svg>
      <h4 style="margin-top:6px">Une semaine entière libre</h4><div class="cookie-phrase">Sept soirs de suite. Une étoile de mer rejoint ton bocal.</div></div>
      <div class="actions"><button class="btn plein" id="ok-etoile">Merci</button></div>`);
    $('#ok-etoile').onclick = () => { fermer(); rendreTout(); };
    return;
  }
  const ep = epargne(S.entrees, S.bons, auj);
  const possibles = S.reglages.envies.filter(v => v.prix > 0 && v.prix <= ep);
  if (!possibles.length || S.dernierCookie === auj) return;
  S.dernierCookie = auj; sauver();
  cookie(hasard(possibles), ep);
}
function cookie(v, ep) {
  pv = null;
  feuille(`<div class="lab" style="color:var(--sage)">Un coquillage s'ouvre</div>
    <div class="cookie-phrase">${esc(hasard(PHRASES))}</div>
    <div class="pas"><b>${euros(ep, true)}</b> mis de côté. De quoi t'offrir ${nombre(1, v.g)} ${esc(v.nom)} (${euros(v.prix, true)}).</div>
    <div class="actions" style="flex-direction:column"><button class="btn plein" id="ck-offre">Je me l'offre</button><button class="btn" id="ck-garde">Je garde pour plus grand</button><button class="btn discret" id="ck-tard">Plus tard</button></div>`);
  $('#ck-offre').onclick = () => {
    const auj = aujourdhui();
    const b = { id: uid(), nom: v.nom, g: v.g, montant: v.prix, cree: auj, valable: ajouterJours(auj, 1), offert: null };
    S.bons.push(b); sauver();
    feuille(`<div class="bon"><div class="t">Bon pour</div><div class="n">${nombre(1, v.g)} ${esc(v.nom)}</div><div class="v">${euros(v.prix, true)}</div><div class="d">valable dès ${dateCourte(b.valable)} · rien ne s'achète le jour même</div></div>
      <div class="actions"><button class="btn plein" id="bon-ok">Je le garde</button></div>`);
    $('#bon-ok').onclick = () => { fermer(); rendreTout(); };
  };
  $('#ck-garde').onclick = () => { fermer(); toast('Gardé. Ça grossit pour plus grand.'); };
  $('#ck-tard').onclick = () => fermer();
}

/* ---------- navigation ---------- */
let ecran = 'saisir';
function rendreTout(flash) { if (ecran === 'saisir') rendreSaisie(flash); else if (ecran === 'bilan') rendreBilan(); else rendreReglages(); }
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  ecran = b.dataset.s;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + ecran));
  if (ecran === 'bilan') { vue.ref = null; envieIdx = Math.floor(Math.random() * 10); }
  if (ecran !== 'saisir') { derniere = null; jourSaisie = null; }
  window.scrollTo(0, 0);
  rendreTout();
});
// au retour dans l'appli (le lendemain par exemple), on remet la date à jour
document.addEventListener('visibilitychange', () => { if (document.hidden) { jourSaisie = null; derniere = null; } else { rendreTout(); surprises(); } });
sauver();
rendreTout();
// ouverture : un toucher la passe
const splash = document.getElementById('splash');
let splashFini = false;
function finSplash() { if (splashFini) return; splashFini = true; splash.classList.add('out'); setTimeout(() => { splash.remove(); surprises(); }, 500); }
splash.addEventListener('click', finSplash);
setTimeout(finSplash, matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 6500);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
